# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  pin_icon: beer
  show_toast: "true"

# override variables
variables:
  trmnl:
    user:
      id: 6458
      name: Excuse Me
      first_name: Excuse
      last_name: Me
      locale: nl
      time_zone: Brussels
      time_zone_iana: Europe/Brussels
      utc_offset: 3600
    device:
      friendly_id: GTDC87
      percent_charged: 100.0
      wifi_strength: 100
      height: null
      width: null
    system:
      timestamp_utc: 1772625328
    plugin_settings:
      instance_name: "It's 5 O'Clock Somewhere"
      strategy: polling
      dark_mode: "no"
      no_screen_padding: "no"
      polling_headers: ""
      custom_fields_values: {}
  # NOTE: transform.js reads input.countries directly (raw polled shape:
  # {country: {t?, p?, c: [{n, y, x, z?, t?, p?}]}}) — mock fields must sit
  # here, not nested under a data: key, or transform()'s early-return kicks
  # in and aqi_response-equivalent ends up empty.
  countries:
    Ecuador:
      t: Salud
      p: sah-lood
      c:
        - { n: Rosa Zarate, y: 0.32779, x: -79.47407 }
    Peru:
      t: Salud
      p: sah-lood
      c:
        - { n: Talara, y: -4.57722, x: -81.27194 }
    Turks and Caicos Islands:
      t: Cheers
      c:
        - { n: Cockburn Town, y: 21.46122, x: -71.14188 }
    Canada:
      t: "Santé"
      p: sahn-tay
      c:
        - { n: Granby, y: 45.40008, x: -72.73243 }

